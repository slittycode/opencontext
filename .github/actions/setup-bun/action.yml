name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-mode:
    description: "Dependency install mode: lean (omit optional) or full"
    required: false
    default: "lean"
runs:
  using: "composite"
  steps:
    - name: Mount Bun Cache
      uses: useblacksmith/stickydisk@v1
      with:
        key: ${{ github.repository }}-bun-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        path: ~/.bun

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: |
        if [ "${{ inputs.install-mode }}" = "full" ]; then
          bun install --frozen-lockfile
        elif [ "${{ inputs.install-mode }}" = "lean" ]; then
          bun install --frozen-lockfile --omit=optional
        else
          echo "Unsupported install-mode: ${{ inputs.install-mode }}" >&2
          exit 1
        fi
      shell: bash
